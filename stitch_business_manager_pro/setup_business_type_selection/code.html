<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center pt-16 pb-12 px-container-padding font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">

<p class="font-body-md text-body-md text-on-surface-variant">Select the setup that best fits the way you operate. You can adjust specific modules later in settings.</p>

<!-- Cards Container -->
<div class="grid md:grid-cols-2 gap-6 w-full max-w-4xl mb-12">
<!-- CARD 1: SMALL BUSINESS (SELECTED STATE) -->
<label class="group relative cursor-pointer block h-full">
<input checked="" class="sr-only" name="business_type" type="radio" value="small"/>
<div class="h-full bg-surface-container rounded-xl border-2 border-primary overflow-hidden transition-all duration-300 card-selected-glow relative flex flex-col">
<!-- Active Indicator (Top Bar) -->
<div class="absolute top-0 left-0 right-0 h-1 bg-primary"></div>
<div class="p-8 flex flex-col h-full gap-6">
<!-- Card Header -->
<div class="flex items-start justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl">storefront</span>
</div>
<div>
<h3 class="font-title-sm text-title-sm text-primary">Small Business</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Simple Mode</span>
</div>
</div>
<!-- Checkmark Indicator -->
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-sm font-bold">check</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface">Simple and efficient tools for shops and small businesses.</p>
<!-- Divider -->
<div class="h-px w-full bg-outline-variant/30"></div>
<!-- Features List -->
<ul class="space-y-3 flex-grow">
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Simple inventory</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Quick billing</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Customer management</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Supplier management</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Payments</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Simple reports</span>
</li>
</ul>
</div>
<!-- Subtle Gradient Background for selected state -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
</div>
</label>
<!-- CARD 2: LARGE BUSINESS (UNSELECTED STATE) -->
<label class="group relative cursor-pointer block h-full">
<input class="sr-only" name="business_type" type="radio" value="large"/>
<div class="h-full bg-surface-container rounded-xl border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all duration-300 flex flex-col opacity-80 hover:opacity-100">
<div class="p-8 flex flex-col h-full gap-6">
<!-- Card Header -->
<div class="flex items-start justify-between">
<div class="flex items-center gap-4">

<div>
<h3 class="font-title-sm text-title-sm text-on-surface">Large Business</h3>

<p class="font-body-md text-body-md text-on-surface-variant">Advanced tools for growing businesses and multiple locations.</p>
<!-- Divider -->
<div class="h-px w-full bg-outline-variant/30"></div>
<!-- Features List -->
<ul class="space-y-3 flex-grow">
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-[18px] mt-0.5">check_circle</span>

<li class="flex items-start gap-3">

</li>

</li>
<li class="flex items-start gap-3">

<!-- Action Area -->
<div class="mt-auto pt-8 border-t border-outline-variant/20 w-full max-w-4xl flex justify-center sm:justify-end">
<button class="bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container px-8 py-3.5 rounded-lg font-title-sm text-title-sm transition-colors duration-200 shadow-lg shadow-primary/20 flex items-center gap-2">
            Continue to Dashboard
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>

<script>
        // Simple script to handle visual state toggle between cards if they were actual radios
        // In a real framework, this would be bound to state. 
        // Here we just ensure clicking visually updates if someone interacts, though "Small" is pre-selected.
        document.querySelectorAll('input[name="business_type"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all cards
                document.querySelectorAll('.group > div').forEach(card => {
                    card.classList.remove('border-primary', 'border-2', 'card-selected-glow');
                    card.classList.add('border', 'border-outline-variant', 'opacity-80');
                    card.querySelector('.absolute.top-0')?.remove();
                    card.querySelector('.bg-gradient-to-br')?.remove();
                    
                    // Reset text colors to unselected state
                    const title = card.querySelector('h3');
                    if(title) title.classList.replace('text-primary', 'text-on-surface');
                    
                    const iconBg = card.querySelector('.bg-primary-container');
                    if(iconBg) iconBg.classList.replace('bg-primary-container', 'bg-surface-variant');
                    
                    const icon = card.querySelector('.text-primary.text-2xl');
                    if(icon) icon.classList.replace('text-primary', 'text-on-surface-variant');

                    const indicator = card.querySelector('.w-6.h-6');
                    if(indicator) {
                        indicator.innerHTML = '';
                        indicator.className = 'w-6 h-6 rounded-full border-2 border-outline-variant group-hover:border-outline transition-colors';
                    }
                });

                // Style selected card
                if(this.checked) {
                    const card = this.nextElementSibling;
                    card.classList.remove('border', 'border-outline-variant', 'opacity-80', 'hover:border-outline');
                    card.classList.add('border-primary', 'border-2', 'card-selected-glow', 'bg-surface-container');
                    
                    // Add decorative elements
                    card.insertAdjacentHTML('afterbegin', '<div class="absolute top-0 left-0 right-0 h-1 bg-primary"></div>');
                    card.insertAdjacentHTML('beforeend', '<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>');

                    const title = card.querySelector('h3');
                    if(title) title.classList.replace('text-on-surface', 'text-primary');

                    const iconBg = card.querySelector('.bg-surface-variant');
                    if(iconBg) iconBg.classList.replace('bg-surface-variant', 'bg-primary-container');
                    
                    const icon = card.querySelector('.text-on-surface-variant.text-2xl');
                    if(icon) icon.classList.replace('text-on-surface-variant', 'text-primary');

                    const indicator = card.querySelector('.w-6.h-6');
                    if(indicator) {
                        indicator.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center';
                        indicator.innerHTML = '<span class="material-symbols-outlined text-on-primary text-sm font-bold">check</span>';
                    }
                }
            });
        });
    </script>
